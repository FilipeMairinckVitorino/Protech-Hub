<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progresso do Aluno Protech Hub</title>
    <meta name="description" content="Área do professor no Protech Hub para consultar por CPF quais apostilas o aluno já concluiu por completo.">
    <meta property="og:title" content="Progresso do Aluno | Protech Hub">
    <meta property="og:description" content="Consulte por CPF as apostilas em que o aluno concluiu todas as atividades.">
    <meta property="og:type" content="website">
    <link rel="stylesheet" href="CSS/common.css">
    <link rel="stylesheet" href="CSS/progresso.css">
    <link rel="shortcut icon" href="Image/favicon.svg" type="image/x-icon">
</head>
<body>
    <header>
        <span class="logo"></span>
        <section class="user">
            <span id="nome_view">Professor</span>
            <button type="button" id="logout" class="logout" aria-label="Sair">Sair</button>
        </section>
    </header>
    <main>
        <section class="busca">
            <h1>Progresso do Aluno</h1>
            <form action="#" method="get" class="progresso">
                <div class="campo">
                    <label for="cpfProgresso">CPF</label>
                    <input type="text" inputmode="numeric" name="cpf" id="cpfProgresso" class="identificador" placeholder="Digite o CPF" required>
                    <button type="submit" id="buscaCPF" aria-label="Buscar CPF"></button>
                    <div class="loader" id="buscaLoad"></div>
                </div>
            </form>
        </section>

        <section class="resultado" id="resultado">
            <h2 id="tituloResultado">Progresso das apostilas</h2>
            <div class="apostilasConcluidas" id="apostilasConcluidas"></div>
            <span id="semApostilas">Este aluno ainda não iniciou nenhuma atividade :(</span>
        </section>
    </main>
    <footer>
        <span class="logo"></span>
    </footer>
<script type="module" src="Script/progresso.js"></script>
<script type="module" src="Script/logout.js"></script>
</body>
</html>
