<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perguntas Protech Hub</title>
    <meta name="description" content="Responda as questões da atividade e confira seu resultado no Protech Hub.">
    <meta property="og:title" content="Perguntas Protech Hub">
    <meta property="og:description" content="Responda as questões da atividade e confira seu resultado no Protech Hub.">
    <meta property="og:type" content="website">
    <link rel="stylesheet" href="CSS/common.css">
    <link rel="stylesheet" href="CSS/questoes.css">
    <link rel="shortcut icon" href="Image/favicon.svg" type="image/x-icon">
</head>
<body>
    <header>
        <span class="logo"></span>
        <section class="user">
            <span id="nome_view"></span>
            <button type="button" id="logout" class="logout" aria-label="Sair">Sair</button>
        </section>
    </header>
    <main>
        <section class="questoes">
            <form action="#" method="post" class="questoes">
                <div id="questoesContainer"></div>
                <button type="submit" id="enviar">Enviar</button>
                <div class="loader" id="enviarLoad"></div>
            </form>
        </section>
        <div class="loader" id="questoesLoad"></div>
    </main>
    <footer>
        <span class="logo"></span>
    </footer>
<script type="module" src="Script/questoes.js"></script>
<script type="module" src="Script/logout.js"></script>
</body>
</html>
